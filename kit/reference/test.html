<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>자동 테스트 — 더블클릭하면 실행됩니다</title><style>body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
margin:0;color:#202b35;line-height:1.62;word-break:keep-all}
header{background:#0d3f78;color:#fff;padding:34px 26px}
header h1{margin:0 0 6px;font-size:30px}header p{margin:0;opacity:.9}
main{max-width:900px;margin:0 auto;padding:0 26px}
section{padding:22px 0;border-bottom:1px solid #e2e8ee}
h2{font-size:21px;color:#0d3f78;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:#f1f6fa;color:#125eb0;text-align:left;padding:9px 11px;font-size:14px}
td{border-bottom:1px solid #e2e8ee;padding:9px 11px;vertical-align:top}
a.btn{display:inline-block;padding:9px 15px;border:1.5px solid #125eb0;border-radius:8px;
margin:0 8px 8px 0;text-decoration:none;color:#125eb0;font-weight:700}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:11px;background:#f1f6fa;
color:#5f6e7d;border:1px solid #c9d4de;margin-right:5px}
.warn{background:#fdf0f2;border-left:5px solid #b83e50;padding:11px 14px;margin:10px 0;font-size:15px}
.ok{background:#edf6f1;border-left:5px solid #18805b;padding:11px 14px;margin:10px 0;font-size:15px}
footer{padding:20px 26px;font-size:13px;color:#5f6e7d;text-align:center;background:#f6f8fa}
img{max-width:100%;border:1px solid #c9d4de;border-radius:6px}
.note{font-size:13px;color:#5f6e7d}
button,select{font:inherit;max-width:100%;padding:7px 10px;margin:3px 0}
#summary{font-size:34px;font-weight:800}.PASS{color:#18805b}.FAIL{color:#b83e50}li{margin:7px 0;font-size:15px}</style></head><body><header><h1>자동 테스트</h1><p>더블클릭하면 실행됩니다 · 설치·인터넷 없이 브라우저만</p></header><main><section><p id="summary">실행 중…</p><ol id="list"></ol><p class="note">검사 이름의 <b>R-01~R-04</b> 는 <code>docs/requirements.md</code> 의 요구사항 번호입니다. 요구 하나를 일부러 깨뜨리면 같은 번호의 검사가 실패해야 합니다.</p><p class="note">iframe · fetch · Node · Python 을 쓰지 않습니다. 실습 PC에 없거나 file:// 에서 막히기 때문입니다.</p></section></main><script src="data/news_sample.js"></script><script src="data/kr_ltir.js"></script><script src="app.js"></script><script>
const tests=[];const test=(n,f)=>tests.push([n,f]);
const eq=(a,b)=>{if(a!==b)throw new Error(`기대 ${b} / 실제 ${a}`)};
const news=window.DATA_NEWS.rows, rates=window.DATA_KR_LTIR.rows;
test('R-01 정상: 발행월 관측이 있으면 값·연월 — 배포 자료 4행',()=>{
  const rows=joinNews(news,rates);
  eq(rows.filter(r=>r.rate.state==='ok').length,4);
  eq(rows.find(r=>r.date.startsWith('2026-08')).rate.label,'4.29%');});
test('R-02 빈 값: 2026-09 관측이 없으면 「미공개」 · 0이 아니다',()=>{
  const row=joinNews(news,rates).find(r=>r.date.startsWith('2026-09'));
  eq(row.rate.state,'missing');eq(row.rate.label,'미공개');eq(row.rate.value,null);});
test('R-03 오류: 값에 글자가 있으면 같은 월 관측을 참조하는 4행만 「확인 필요」 · 다른 월은 유지',()=>{
  const broken=rates.map(r=>r[0]==='2026-08'?[r[0],'확인필요']:r);
  const rows=joinNews(news,broken);
  eq(rows.filter(r=>r.rate.state==='invalid').length,4);
  eq(rows.filter(r=>r.rate.state==='missing').length,1);});
test('R-04 계산: 20개가 모이기 전에는 이동평균을 내지 않는다',()=>{
  eq(movingAverage([['d1',10],['d2',20]],20).every(([,v])=>v===null),true);
  eq(movingAverage(Array.from({length:20},(_,i)=>['d'+i,10]),20).slice(-1)[0][1],10);
  // 빈 값은 «건너뛴다» — 0 으로 채우면 5 가 나온다. 차트와 같은 답이어야 한다.
  eq(movingAverage([['d1',10],['d2',null],['d3',20]],2).slice(-1)[0][1],15);});
let pass=0;const list=document.getElementById("list");
for(const [name,fn] of tests){const li=document.createElement("li");
  try{fn();li.className="PASS";li.textContent="PASS · "+name;pass++;}
  catch(e){li.className="FAIL";li.textContent="FAIL · "+name+" — "+e.message;}
  list.appendChild(li);}
const s=document.getElementById("summary");
s.textContent=pass+"/"+tests.length+" PASS";s.className=pass===tests.length?"PASS":"FAIL";
</script></body></html>
